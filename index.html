<style>

:root{

.hero{margin:18px 24px 0;padding:17px 18px 14px;border-radius:14px;background:#fff;border:1px solid #dbe2d9;box-shadow:0 3px 9px #26352b04;position:relative;cursor:pointer;transition:border-color .18s,box-shadow .18s}

.arrow{display:grid;place-items:center;transition:transform .35s cubic-bezier(.3,.7,.2,1)}

.row.sel{background:#fff;box-shadow:inset 3px 0 0 color-mix(in srgb,var(--c) 75%,#273e3c)}

.hero .det{padding-top:12px;margin-top:12px;border-top:1px solid #e5e8df}

@media(max-width:760px){

  body{height:auto;min-height:100dvh;overflow:auto}

<style>
/* ── 80s street-sign skin: enamel white, thick black border, signal red, heavy condensed type ── */
:root{--sheet:#f2eee3;--paper:#fbfaf5;--ink:#111;--mute:#3b3934;--red:#d9140e;--night:#efeadc;--map-ink:#111;--accent:#d9140e;
  --police:#1d4ed8;--fire:#f07800;--medical:#0b9466;--serious:#d9140e;--font:"Archivo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
html,body{background:var(--sheet);color:var(--ink)}
button:focus-visible,a:focus-visible,[role="button"]:focus-visible{outline:3px solid var(--red)}
#appbar{background:var(--paper);border-bottom:4px solid var(--ink)}
.brand{gap:12px}
.brand-mark{width:auto;height:auto;background:none;border-radius:0;color:var(--red)}
.brand-mark svg{width:86px;height:42px}
.brand-name{display:flex;flex-direction:column;align-items:stretch;text-transform:uppercase;color:var(--ink);letter-spacing:0;line-height:.9}
.brand-name small{font-size:15px;font-weight:800;letter-spacing:.02em}
.brand-name span{color:var(--ink);font-size:29px;font-weight:900;font-stretch:80%;letter-spacing:.22em;margin-right:-.22em}
.brand-description{border-left:3px solid var(--ink);color:var(--ink);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}
.public-badge{border:2px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:4px;font-size:11px;font-weight:800}
.city{color:var(--ink);font-weight:900;font-size:12px;letter-spacing:.12em}
#mapwrap{border:4px solid var(--ink);border-radius:18px;background:var(--night);box-shadow:5px 5px 0 var(--ink);margin-right:21px;margin-bottom:21px}
#map,.leaflet-container{background:var(--night)}
#map::after{box-shadow:none}
.leaflet-control-attribution{background:rgba(251,250,245,.92)!important;color:#333!important;border-top:2px solid var(--ink);border-left:2px solid var(--ink)}
.leaflet-control-attribution a{color:#111!important}
.btn{background:var(--paper);border:3px solid var(--ink);color:var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--ink)}
.btn:hover{background:#fff;color:var(--ink)}
.btn.on{background:var(--red);color:#fff;border-color:var(--ink)}
#backbtn{background:var(--red);color:#fff;border:3px solid var(--ink);border-radius:8px;box-shadow:3px 3px 0 var(--ink);font-weight:900;text-transform:uppercase;letter-spacing:.08em}
.ring-label{color:var(--red);font:900 13px var(--font);text-shadow:0 0 3px #fff,0 0 6px #fff,0 0 9px #fff}
.dot{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--ink)}
.dot.fresh{animation:nwpulse 2.4s ease-out infinite}
@keyframes nwpulse{0%{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--ink),0 0 0 3.5px var(--c)}100%{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--ink),0 0 0 16px transparent}}
.dot.sel{outline:3px solid var(--red);outline-offset:4px}
.youdot{width:20px;height:20px;background:var(--red);border:4px solid #fff;box-shadow:0 0 0 3px var(--ink),0 0 0 10px rgba(217,20,14,.18)}
.pindot{background:var(--red);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
#sheet{background:var(--sheet)}
.eyebrow{color:var(--ink);font-weight:900}
#title{font-size:44px;font-weight:900;font-stretch:72%;text-transform:uppercase;letter-spacing:0;line-height:1}
#count{background:var(--ink);color:var(--paper);border-radius:4px;font-weight:800}
#fresh{color:var(--mute);font-weight:600}
#fresh.current::before{background:#0b9466}
#controls{border-bottom:3px solid var(--ink)}
#seg{background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:3px;height:50px}
#seg button{color:var(--ink);font-weight:900}
#seg button.on{color:var(--paper)}
#seg .thumb{top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/4);border-radius:6px;background:var(--ink);box-shadow:none}
#sev{height:50px;border:3px solid var(--ink);background:var(--paper);color:var(--ink);font-weight:900;text-transform:uppercase;letter-spacing:.04em}
#sev i{background:var(--red);width:8px;height:8px}
#sev:hover{border-color:var(--ink)}
#sev.on{background:var(--red);color:#fff;border-color:var(--ink)}#sev.on i{background:#fff}
.key{color:var(--ink);font-weight:800}
.key i{width:11px;height:11px;background:var(--c);box-shadow:0 0 0 2px var(--ink)}
.hero{background:var(--paper);border:4px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink);margin-right:29px}
.hero:hover{border-color:var(--ink);box-shadow:5px 5px 0 var(--ink)}
.hero.hot{background:var(--paper);border-color:var(--ink);box-shadow:5px 5px 0 var(--red)}
.hero.hot .hero-meta .eyebrow{color:var(--red)}
.hero.hot .hero-meta .eyebrow::before{background:var(--red);width:8px;height:8px}
.incident-kind{background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:4px;font-weight:900;text-transform:uppercase;letter-spacing:.05em}
.incident-kind svg{color:var(--c)}
.hero .what{font-size:30px;font-weight:900;font-stretch:72%;text-transform:uppercase;letter-spacing:0;line-height:1.05}
.hero .where{color:#2c2a26;font-weight:600}
.hero .dist{font-size:58px;font-weight:900;font-stretch:72%;letter-spacing:0}
.hero .dist small{color:var(--ink);font-weight:800}
.distance-label,.hero .when{color:#2c2a26;font-weight:700}
.hero .when{white-space:normal;text-align:right;line-height:1.2}.hero .compass{flex:none;border:3px solid var(--ink);background:var(--paper);color:var(--ink)}
.hero .why{border-top:2px dashed var(--ink);color:var(--ink);font-weight:700}
.disclosure{color:var(--ink)}
.hero.sel{border-color:var(--ink);box-shadow:5px 5px 0 var(--red)}
.list-label{margin:24px 24px 4px;padding:9px 12px;background:var(--ink);color:var(--paper);border-radius:6px;font-weight:900;letter-spacing:.14em}
.list-label span:last-child{color:#c9c4b6}
.row:hover{background:#e9e4d6}
.row::after{background:#c4bda9;height:2px}
.glyph{width:42px;height:42px;background:var(--c);color:#fff;border:2.5px solid var(--ink);border-radius:9px}
.row{grid-template-columns:42px minmax(0,1fr) auto}
.row::after{left:76px}
.row .what{font-weight:900;font-stretch:80%;text-transform:uppercase;letter-spacing:.01em;font-size:18px}
.row .sub{color:#3b3934;font-weight:500}
.row .km{font-weight:900;font-stretch:75%;font-size:22px;letter-spacing:0}
.row .km small{color:var(--ink)}
.row .ago{color:#3b3934;font-weight:600}
.row.old .what,.row.old .km{color:#56524a}
.flag{width:8px;height:8px}
.flag.ser{background:var(--red)}.flag.new{background:#e8a400}
.row .arrow{color:var(--ink)}
.row.sel{background:var(--paper);box-shadow:inset 7px 0 0 var(--c)}
.det{color:#2c2a26}.det b{color:var(--ink)}
.hero .det{border-top:2px dashed var(--ink)}
.empty{color:#2c2a26;font-weight:600}
.empty::before{border:3px solid var(--ink);background:var(--red);box-shadow:none;border-radius:6px;width:30px;height:30px}
.foot{color:#3b3934}
#panel-foot{border-top:3px solid var(--ink);color:var(--ink);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
#panel-foot i{background:var(--red);width:7px;height:7px}
#oops{background:var(--red);border:3px solid var(--ink)}
@media(max-width:760px){
  #appbar{height:calc(64px + env(safe-area-inset-top))}
  .brand{gap:10px}.brand-mark{width:auto;height:auto;border-radius:0}.brand-mark svg{width:72px;height:35px}
  .brand-name{font-size:inherit;letter-spacing:0}.brand-name small{font-size:13px}.brand-name span{font-size:25px}

  .list-label{margin-left:20px;margin-right:20px}
  .row::after{left:73px}
}
@media(max-width:430px){.brand-name small{font-size:12px}.brand-name span{font-size:23px}.city svg{display:none}}
@media(max-width:370px){.city{display:none}}

.hero .newpill{font-size:13px}
#toast{left:50%;top:18px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 110px);background:var(--ink);color:var(--paper);font-weight:800;font-size:15px;line-height:1.35;padding:11px 14px;border-radius:8px;box-shadow:3px 3px 0 var(--red);text-align:center}
#toast[hidden]{display:none}

.tags{display:block;margin-top:3px;font-weight:800;color:var(--ink);white-space:normal}
.row .what{display:block;line-height:1.1}.row .what span{white-space:normal;overflow:visible}.row .what .flag,.row .what .newpill{display:inline-block;margin-left:7px;vertical-align:3px}
</style>

      related: (i.related || []).filter(r => r.minutes_apart <= 30).length });
  }
  // same event often arrives twice (two callers, re-dispatch): keep the first
  out.sort((a, b) => a.t - b.t);
  const kept = [];
  for (const c of out) {
    const dup = kept.slice(-60).some(k => k.kind === c.kind && c.t - k.t < 1800e3 && Math.abs(k.lat - c.lat) < .0018 && Math.abs(k.lng - c.lng) < .0025 && k.code === c.code);
    if (!dup) kept.push(c);
  }
  // one row per event when police and fire both logged it; keep the more serious entry (fire wins ties: it has the units)
  const byId = new Map(kept.map(c => [c.id, c])), gone = new Set();
  for (const c of kept) {
    if (gone.has(c.id)) continue;
    for (const id of c.links) {
      const o = byId.get(id);
      if (!o || gone.has(o.id) || (o.kind === 'police') === (c.kind === 'police')) continue;
      const pol = c.kind === 'police' ? c : o, fir = pol === c ? o : c;
      if (!sameEvent(pol, fir)) continue;
      const keep = RANK[pol.sev] > RANK[fir.sev] ? pol : fir, drop = keep === pol ? fir : pol;
      keep.both = true; keep.otherLabel = drop.label; keep.otherKind = drop.kind;
      if (RANK[drop.sev] > RANK[keep.sev]) keep.sev = drop.sev;
      keep.related = Math.max(0, keep.related - 1);
      gone.add(drop.id);
      if (drop === c) break;
    }
  }
  return kept.filter(c => !gone.has(c.id));
}

async function getJSON(url) {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 12000);
  try {
    const r = await fetch(url + '?v=' + Date.now(), { cache: 'no-store', signal: ctl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(timer); }
}

// When the data was last really fresh: the newest time a source answered (older feeds only have "generated")
function feedTime(d) {
  const ok = Object.values(d.source_ok || {}).map(Date.parse).filter(Boolean);
  return ok.length ? Math.max(...ok) : (Date.parse(d.generated) || 0);
}

// Last good calls are kept on the phone, so a dead zone or an outage still shows something (clearly marked)
const CACHE_KEY = 'calls_v1';
function saveCache() { try { localStorage.setItem('nw_' + CACHE_KEY, JSON.stringify({ at: S.dataAt, ok: S.sourceOk, calls: S.calls })); } catch (e) {} }
function loadCache() {
  try {
    const c = JSON.parse(localStorage.getItem('nw_' + CACHE_KEY) || 'null');
    if (c && Array.isArray(c.calls) && c.at && Date.now() - c.at < 36 * 3600e3) return c;
  } catch (e) {}
  return null;
}

let retryTimer = null, failures = 0;
async function load() {
  if (S.loading) return;
  S.loading = true; $('refresh').classList.add('spin'); clearTimeout(retryTimer);
  // ask every feed at once and keep whichever is freshest: one stalled collector can't freeze the app
  const got = await Promise.allSettled(FEEDS.map(u => getJSON(u).then(d => {
    if (!d || !Array.isArray(d.incidents)) throw new Error('feed has no calls');
    return { d, u, at: feedTime(d) };
  })));
  const good = got.filter(g => g.status === 'fulfilled').map(g => g.value).sort((a, b) => b.at - a.at);
  if (good.length) {
    const { d, u, at } = good[0];
    S.calls = prepare(d.incidents); S.dataAt = at; S.generated = at; S.sourceOk = d.source_ok || {}; S.sourceStatus = d.source_status || {};
    S.feedUrl = u; S.feedErr = null; S.offline = false; failures = 0;
    saveCache();
  } else {
    const e = got[0].reason || {};
    S.feedErr = !navigator.onLine ? 'No connection' : e.name === 'AbortError' ? 'Calls took too long to load' : 'Couldn’t load calls';
    if (!S.calls.length) { const c = loadCache(); if (c) { S.calls = c.calls; S.dataAt = S.generated = c.at; S.sourceOk = c.ok || {}; } }
    S.offline = true; failures++;
    retryTimer = setTimeout(load, Math.min(60000, 10000 * failures)); // try again soon instead of waiting a full minute
  }
  S.loading = false; $('refresh').classList.remove('spin');
  render();
}

// ── location ──
let watchId = null;
function onPos(p) {
  const c = p.coords;
  if (!isFinite(c.latitude) || !isFinite(c.longitude)) return;
  S.me = [c.latitude, c.longitude]; store.set('me', S.me);
  S.gpsHeading = (c.speed != null && c.speed > 2 && c.heading != null && !isNaN(c.heading)) ? c.heading : null; // driving: GPS knows the way you're going
  S.accuracy = c.accuracy || null; S.locErr = null; S.locLive = true;
  if (S.follow && !S.pin) { if (!S.placed) { S.placed = true; fitRing(true); } else map.panTo(S.me, { animate: true }); }
  drawRings(); render();
}
function onPosErr(e) {
  if (S.locLive && e.code !== 1) return; // a hiccup after a good fix: keep using the last one quietly
  S.locErr = e.code === 1 ? 'Location is off for this page, so this is ' + (S.me ? 'your last known spot' : 'Lawrence & Warden')
    : S.me ? 'Waiting for GPS, showing your last known spot' : 'Waiting for GPS';
  render();
}
function locate() {
  if (!navigator.geolocation) { onPosErr({ code: 2 }); return; }
  if (watchId != null) navigator.geolocation.clearWatch(watchId); // one watcher only, however often refresh is pressed
  navigator.geolocation.getCurrentPosition(onPos, onPosErr, { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 });
  watchId = navigator.geolocation.watchPosition(onPos, onPosErr, { enableHighAccuracy: true, maximumAge: 10000, timeout: 30000 });
}

// ── compass (optional; GPS heading takes over while driving) ──
function onOrient(e) {
  let h = null;
  if (e.webkitCompassHeading != null) h = e.webkitCompassHeading;
  else if (e.absolute && e.alpha != null) h = (360 - e.alpha) % 360;
  if (h == null) return;
  h += (screen.orientation && screen.orientation.angle) || 0;
  S.heading = (h + 360) % 360; updateArrows();
}
$('compass').onclick = async () => {
  if (S.compassOn) { S.compassOn = false; S.heading = null; window.removeEventListener('deviceorientationabsolute', onOrient); window.removeEventListener('deviceorientation', onOrient); $('compass').classList.remove('on'); $('compass').setAttribute('aria-pressed', 'false'); updateArrows(); return; }
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      if (await DeviceOrientationEvent.requestPermission() !== 'granted') return;
    }
  } catch (e) { return; }
  S.compassOn = true; $('compass').classList.add('on'); $('compass').setAttribute('aria-pressed', 'true');
  window.addEventListener('ontouchstart' in window && 'ondeviceorientationabsolute' in window ? 'deviceorientationabsolute' : 'deviceorientation', onOrient);
};
function facing() { return S.gpsHeading != null ? S.gpsHeading : (S.compassOn ? S.heading : null); }
function updateArrows() {
  const f = facing() || 0;
  document.querySelectorAll('.arrow').forEach(a => { a.style.transform = 'rotate(' + ((+a.dataset.b - f + 360) % 360) + 'deg)'; });
}

// ── new since your last look: remember which calls were on screen when the page was put away ──
let seenIds = new Set(store.get('seen', [])), firstLook = store.get('seen', null) == null;
const isNew = r => !firstLook && !seenIds.has(r.id);
function markSeen() {
  if (!S.calls.length) return;
  const ids = S.calls.map(c => c.id); store.set('seen', ids);
  seenIds = new Set(ids); firstLook = false; // coming back later flags only what arrived after this
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') markSeen(); });
window.addEventListener('pagehide', markSeen);

// ── home: tap to look around home, tap again for back to you; hold to set home to the spot in the middle of the rings ──
S.home = store.get('home', null);
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.timer); toast.timer = setTimeout(() => { t.hidden = true; }, 3200); }
function setHome() {
  S.home = centre().slice(); store.set('home', S.home); S.atHome = !!S.pin; render();
  toast(S.me || S.pin ? 'Home saved here. Hold the house button to move it.' : 'No location yet, so home is Lawrence & Warden. Hold the house button to move it.');
}
function goHome() { S.pin = S.home.slice(); S.atHome = true; S.follow = false; S.sel = null; fitRing(true); drawRings(); render(); showBack(); }
(() => {
  const b = $('home'); let timer = null, held = false;
  b.addEventListener('pointerdown', () => { held = false; clearTimeout(timer); timer = setTimeout(() => { held = true; if (navigator.vibrate) navigator.vibrate(30); setHome(); }, 700); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => clearTimeout(timer)));
  b.addEventListener('contextmenu', e => e.preventDefault());
  b.onclick = () => {
    if (held) { held = false; return; }
    if (!S.home) setHome(); else if (S.atHome) $('backbtn').onclick(); else goHome();
  };
})();

// ── render ──
function ago(t) {
  const m = Math.max(0, Math.round((Date.now() - t) / 60000));
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.floor(m / 60), r = m % 60;
  return h + ' h' + (h < 6 && r ? ' ' + r + ' min' : '') + ' ago';
}
function clock(t) { return new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
function fmtDist(km, approx) {
  const pre = approx ? '~' : '';
  if (km < 1) return pre + Math.max(10, Math.round(km * 1000 / 10) * 10) + '<small> m</small>';
  return pre + (km < 10 ? km.toFixed(1) : Math.round(km)) + '<small> km</small>';
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ARROW = '<svg viewBox="0 0 24 24"><path d="M12 3l6 16.5-6-3.6-6 3.6z"/></svg>';
const GLYPH = {
  police: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5z"/></svg>',
  fire: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3.5 5.5 6 5.5 11a5.5 5.5 0 0 1-11 0c0-2.6 1.3-4.3 2.6-5.6.2 1.8 1 3 2.2 3.6C11 8.5 11 5 12 2z"/></svg>',
  medical: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg>',
};
const KIND_NAME = { police: 'Police', fire: 'Fire', medical: 'Medical' };
const SERIOUS = c => c.sev === 'critical' || c.sev === 'high';
const isFresh = (r, now) => now - r.t <= FRESH_MIN * 60000;

function visible() {
  const c = centre(), cut = Date.now() - S.win * 60000;
  return S.calls
    .filter(x => x.t >= cut && (!S.serious || SERIOUS(x)))
    .map(x => { const p = [x.lat, x.lng]; return Object.assign(x, { km: distKm(c, p), b: bearing(c, p) }); })
    .sort((a, b) => a.km - b.km);
}

function renderControls() {
  const seg = $('seg');
  if (!seg.querySelector('button')) {
    WINDOWS.forEach(([m, l]) => { const b = document.createElement('button'); b.dataset.w = m; b.textContent = l; b.onclick = () => { S.win = m; store.set('win', m); S.sel = null; render(); }; seg.appendChild(b); });
    $('sev').onclick = () => { S.serious = !S.serious; S.sel = null; render(); };
  }
  const i = WINDOWS.findIndex(w => w[0] === S.win);
  seg.querySelectorAll('button').forEach((b, k) => { b.classList.toggle('on', k === i); b.setAttribute('aria-pressed', k === i); });
  seg.querySelector('.thumb').style.transform = `translateX(${i * 100}%)`;
  $('sev').classList.toggle('on', S.serious); $('sev').setAttribute('aria-pressed', S.serious);
}

const tagline = r => { const t = [r.both && 'Police + fire', r.nUnits >= 3 && `${r.nUnits} units`].filter(Boolean); return t.length ? `<span class="tags">${t.join(' · ')}</span>` : ''; };
function details(r) {
  return `<div class="det">
    ${r.note ? `<p class="note">${esc(r.note)}</p>` : ''}
    <p><b>${clock(r.t)}</b>, ${KIND_NAME[r.kind]}${r.code && r.kind === 'police' ? ` (code ${esc(r.code)})` : ''}</p>
    ${r.approx ? '<p>Medical calls only list the postal area, so the spot is approximate.</p>' : ''}
    ${r.both ? `<p>Police and firefighters are both on this. ${r.otherKind === 'police' ? 'Police' : 'Fire'} logged it as <b>${esc(r.otherLabel)}</b>.</p>` : ''}
    ${r.nUnits ? `<p><b>${r.nUnits} unit${r.nUnits > 1 ? 's' : ''}</b> responding: ${esc(r.units)}</p>` : ''}
    ${r.div ? `<p>${r.kind === 'police' ? 'Division' : 'Station'} ${esc(r.div)}</p>` : ''}
    ${r.related ? `<p><b>${r.related}</b> other call${r.related > 1 ? 's' : ''} close by around the same time</p>` : ''}
  </div>`;
}

function freshness(now) {
  const notes = [];
  let cls = 'current';
  if (!S.pin && S.locErr) { notes.push(S.locErr); cls = 'stale'; }
  else if (!S.pin && S.locLive && S.accuracy > 800) notes.push(`Location is rough, within ${(S.accuracy / 1000).toFixed(1)} km`);
  if (!S.dataAt) {
    notes.push(S.feedErr ? S.feedErr + '. Retrying.' : 'Loading calls');
    cls = S.feedErr ? 'err' : '';
  } else {
    const age = Math.round((now - S.dataAt) / 60000);
    if (S.offline) { notes.push(`${S.feedErr}. Showing calls from ${clock(S.dataAt)}, retrying`); cls = 'stale'; }
    else notes.push(age < 1 ? 'Updated just now' : age < 60 ? `Updated ${age} min ago` : `Last updated ${clock(S.dataAt)}, feeds may be down`);
    if (!S.offline && age >= 10) cls = 'stale';
    // one feed down while the other keeps working: say which, and since when
    for (const [src, name] of [['police', 'Police'], ['fire', 'Fire and medical']]) {
      const t = Date.parse((S.sourceOk || {})[src]);
      if (t && S.dataAt - t > 10 * 60000) { notes.push(`${name} feed down since ${clock(t)}`); cls = 'stale'; }
    }
  }
  S.freshClass = cls;
  return notes.join('. ');
}

function render() {
  try { renderAll(); } catch (e) { oops(e); }
}
function renderAll() {
  renderControls();
  const rows = visible(), now = Date.now(), f = facing() || 0;
  const turn = r => ((r.b - f + 360) % 360).toFixed(0);

  // header
  $('title').textContent = S.atHome ? 'Near home' : S.pin ? 'Near this spot' : 'Near you';
  $('home').classList.toggle('on', !!S.atHome); $('home').setAttribute('aria-pressed', !!S.atHome);
  $('compass').setAttribute('aria-pressed', S.compassOn);
  const within = rows.filter(r => r.km <= 5).length;
  $('count').textContent = S.generated ? `${within} within 5 km` : '';
  const newN = rows.filter(isNew).length;
  $('fresh').textContent = freshness(now) + (newN ? `. ${newN} new since your last look` : ''); $('fresh').className = S.freshClass;

  // map dots
  const want = new Set();
  rows.forEach(r => {
    want.add(r.id);
    const fresh = isFresh(r, now), col = COLORS[r.kind], size = SERIOUS(r) ? 16 : 11;
    const html = `<div class="dot${fresh ? ' fresh' : ''}${S.sel === r.id ? ' sel' : ''}" style="--c:${col};width:${size}px;height:${size}px;background:${col};opacity:${fresh || SERIOUS(r) ? 1 : .7}"></div>`;
    const icon = L.divIcon({ className: '', html, iconSize: [size, size], iconAnchor: [size / 2, size / 2] });
    let m = dotMarkers.get(r.id);
    if (!m) { m = L.marker([r.lat, r.lng], { icon, zIndexOffset: SERIOUS(r) ? 500 : 0 }).addTo(dots); m.on('click', () => select(r.id, true)); dotMarkers.set(r.id, m); }
    else m.setIcon(icon);
    const markerEl = m.getElement();
    if (markerEl) { markerEl.setAttribute('aria-label', r.label + ', ' + r.loc); markerEl.title = r.label + ' · ' + r.loc; }
  });
  for (const [id, m] of dotMarkers) if (!want.has(id)) { dots.removeLayer(m); dotMarkers.delete(id); }

  const list = $('list');
  if (!rows.length) {
    list.innerHTML = `<div class="empty">${S.generated ? `No ${S.serious ? 'serious ' : ''}calls in the last ${WINDOWS.find(w => w[0] === S.win)[1]}. Pick a longer window to see more.` : esc(S.feedErr || 'Loading calls')}</div>`;
    return;
  }

  // hero: a fresh call within 2 km wins; otherwise simply the closest
  const hot = rows.filter(r => r.km <= NEAR_KM && isFresh(r, now));
  const h = hot[0] || rows[0];
  const why = hot.length ? `${hot.length === 1 ? 'New call' : hot.length + ' new calls'} within ${NEAR_KM} km in the last ${FRESH_MIN} min` : 'Closest call';
  const heroHtml = `<div class="hero${hot.length ? ' hot' : ''}${S.sel === h.id ? ' sel' : ''}" data-id="${esc(h.id)}" role="button" tabindex="0" aria-expanded="${S.sel === h.id}" aria-label="${esc(h.label)}, ${esc(h.loc)}. Show call details" style="--c:${COLORS[h.kind]}">
    <div class="hero-meta"><span class="eyebrow">${hot.length ? 'Nearby & recent' : 'Closest call'}</span><span class="incident-kind">${GLYPH[h.kind]}${KIND_NAME[h.kind]}</span></div>
    <div class="what">${esc(h.label)}${isNew(h) ? '<b class="newpill">New</b>' : ''}${SERIOUS(h) ? '<i class="flag ser" title="Serious"></i>' : ''}</div>
    <div class="where">${esc(h.loc)}${tagline(h)}</div>
    <div class="top"><div class="distance"><div class="dist">${fmtDist(h.km, h.approx)}</div><span class="distance-label">away</span></div><div class="direction-meta"><span class="when">${ago(h.t)}</span><div class="compass"><div class="arrow" data-b="${h.b.toFixed(0)}" style="transform:rotate(${turn(h)}deg)">${ARROW}</div></div></div></div>
    <div class="why"><span>${why}</span><svg class="disclosure" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></div>
    ${details(h)}
  </div>`;

  const rest = rows.filter(r => r !== h).slice(0, MAX_ROWS);
  list.innerHTML = heroHtml + (rest.length ? '<div class="list-label"><span>More nearby</span><span>Closest first</span></div>' : '') + rest.map(r => {
    const old = now - r.t > 180 * 60000;
    const flag = SERIOUS(r) ? '<i class="flag ser" title="Serious"></i>' : isFresh(r, now) ? '<i class="flag new" title="New"></i>' : '';
    return `<div class="row${old ? ' old' : ''}${S.sel === r.id ? ' sel' : ''}" data-id="${esc(r.id)}" role="button" tabindex="0" aria-expanded="${S.sel === r.id}" aria-label="${esc(r.label)}, ${esc(r.loc)}. Show call details" style="--c:${COLORS[r.kind]}">
      <span class="glyph">${GLYPH[r.kind]}</span>
      <div class="mid"><div class="what"><span>${esc(r.label)}</span>${isNew(r) ? '<b class="newpill">New</b>' : ''}${flag}</div><div class="sub">${esc(r.loc)}${tagline(r)}</div></div>
      <div class="far"><div class="km">${fmtDist(r.km, r.approx)}<span class="arrow" data-b="${r.b.toFixed(0)}" style="transform:rotate(${turn(r)}deg)">${ARROW}</span></div><div class="ago">${ago(r.t)}</div></div>
      ${details(r)}
    </div>`;
  }).join('')
    + `<div class="foot">${rows.length - 1 > MAX_ROWS ? `Showing the closest ${MAX_ROWS + 1} of ${rows.length}. ` : ''}Arrows point ${facing() != null ? 'the way you’re facing' : 'north-up'}. Long-press the map to check another spot.${S.noStreets ? ' Street map temporarily unavailable.' : ''}<br>Toronto Police and Toronto Fire public feeds.</div>`;
  list.querySelectorAll('[data-id]').forEach(el => {
    el.onclick = e => { if (e.target.closest('a')) return; select(el.dataset.id, false); };
    el.onkeydown = e => {
      if (e.target !== el || (e.key !== 'Enter' && e.key !== ' ')) return;
      e.preventDefault(); const id = el.dataset.id; select(id, false);
      list.querySelector(`[data-id="${CSS.escape(id)}"]`)?.focus({ preventScroll: true });
    };
  });
}

function select(id, scroll) {
  S.sel = S.sel === id && !scroll ? null : id;
  render();
  const c = S.calls.find(x => x.id === id);
  if (S.sel && c) {
    S.follow = false; showBack();
    map.flyTo([c.lat, c.lng], Math.max(map.getZoom(), 15), { duration: .6 });
    if (scroll) { const el = document.querySelector(`[data-id="${CSS.escape(id)}"]`); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  }
}

$('region').onclick = () => { S.follow = false; S.sel = null; map.flyToBounds([[43.58, -79.64], [43.86, -79.11]], { duration: .8 }); showBack(); };
// ── safety net: if anything breaks, say so and offer a reload instead of freezing ──
function oops(e) {
  console.error(e);
  const bar = $('oops'); if (!bar || bar.dataset.on) return;
  bar.dataset.on = 1; bar.hidden = false;
}
window.addEventListener('error', e => { if (e.error) oops(e.error); });
window.addEventListener('unhandledrejection', e => oops(e.reason));
$('oops').onclick = () => location.reload();

// ── go ──
$('refresh').onclick = () => { load(); locate(); };
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { load(); locate(); } }); // coming back to the app = fresh data and position
window.addEventListener('online', () => load());
window.addEventListener('pageshow', e => { if (e.persisted) load(); });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {}); // lets the home-screen app open with no signal
setInterval(() => { if (document.visibilityState === 'visible') load(); }, 60000);
setInterval(() => { if (document.visibilityState === 'visible' && S.calls.length) render(); }, 30000); // keep "x min ago" honest
new ResizeObserver(() => map.invalidateSize({ pan: false })).observe($('map'));
{ const c = loadCache(); if (c) { S.calls = c.calls; S.dataAt = S.generated = c.at; S.sourceOk = c.ok || {}; S.offline = false; } } // instant first paint from the last visit
drawRings(); showBack(); render();
load(); locate();
</script>
</body>
</html>
